</style></head><body><a class="hub-back" href="../../index.html" aria-label="返回五上社會學習評量中心">← 返回評量中心</a><a class="skip" href="#assessment">跳到評量內容</a><header><div class="bar"><svg class="emblem" viewBox="0 0 64 64" role="img" aria-label="島嶼文化圖示"><path d="M8 49c8-18 15-27 24-39 9 12 16 21 24 39-15-7-33-7-48 0z" fill="#ffd08a"/><circle cx="32" cy="37" r="8" fill="#fff"/><path d="M32 29v16M24 37h16" stroke="#d76a1f" stroke-width="3"/></svg><div class="title-wrap"><p class="eyebrow">社會五上・第四單元</p><h1 class="title">看見福爾摩沙</h1></div><div class="score-chip">滿分 100</div></div></header><div class="progress-wrap"><div class="progress-inner"><span class="progress-label">作答進度</span><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="29" aria-valuenow="0"><div class="fill"></div></div><span class="count">0／29</span></div></div><main id="assessment"><div class="intro"><div><h2>追尋航海時代的臺灣足跡</h2><p>每題作答後立即查看對錯與說明。完成全部題目後，系統會公布總成績。</p></div><div class="legend"><span class="tag">即時回饋</span><span class="tag">依原卷配分</span><span class="tag">免登入</span></div><div class="student-picker"><label for="studentName">請輸入座號與姓名</label><input id="studentName" type="text" inputmode="text" autocomplete="off" maxlength="20" required aria-describedby="studentHelp" placeholder="例如：12 王小明"><span class="student-help" id="studentHelp">輸入座號與姓名後，題目就會開放作答。</span></div></div><form id="quiz" novalidate></form><p class="finish-note" id="finishNote">完成全部 29 題後，成績會在這裡公布。</p><section class="result" id="result" aria-live="polite" tabindex="-1"><h2>評量完成</h2><div class="score-summary" aria-label="學生姓名與評量成績"><div class="score-field"><span class="score-label">學生姓名</span><strong class="student-value" id="studentResultName">尚未選擇</strong></div><div class="score-field"><span class="score-label">評量成績</span><strong class="score-value"><span id="finalScore">0</span><small>／100 分</small></strong></div></div><p id="resultMessage"></p><div class="review" id="reviewMessage"></div><div class="actions"><button class="b <script>
const tf1=[
["荷蘭統治臺灣時，規定原住民族各社推派長老參與定期集會。",1,"荷蘭人透過地方會議召集各社長老，協助管理原住民族部落。"],
["臺灣東北方的三貂角，地名是從荷蘭語翻譯而來。",0,"三貂角的地名來源與西班牙語有關，不是荷蘭語。"],
["荷蘭人最初占領臺灣，是為了建立與法國貿易的據點。",0,"荷蘭人看重臺灣位於東亞航線的位置，目標並非只和法國貿易。"],
["鄭成功建立了臺灣第一個漢人政權。",1,"鄭成功驅逐荷蘭人後，在臺灣建立第一個漢人政權。"],
["西班牙人在臺期間，向民眾宣揚天主教。",1,"西班牙傳教士在北臺灣向居民傳播天主教。"],
["西班牙曾招募大量漢人來臺種植甘蔗，以發展蔗糖貿易。",0,"招募漢人種甘蔗並發展蔗糖貿易，主要是荷蘭人的作為。"],
["荷蘭人將臺灣作為貿易根據地，對外輸出蔗糖與鹿皮。",1,"蔗糖與鹿皮是荷蘭統治臺灣時的重要出口商品。"],
["大航海時期以前，已有日本商人來臺。",1,"在歐洲勢力抵臺前，日本商人已與臺灣有所往來。"],
["臺南沿海曾是潟湖，人們靠牛車和船往來，後來因泥沙堆積逐漸成為陸地。",1,"臺江內海因河川泥沙堆積與地形變化，逐漸陸化。"]];
const mc=[
["鄭經接受誰的建議，積極在臺灣推展文化與教育？",["鄭成功","陳永華","鄭克塽","施琅"],1,"陳永華協助鄭經推動文教建設，被稱為鄭氏政權的重要人物。"],
["有關鄭氏政權國際貿易，哪一項正確？",["主要與美國商人交易","從中國進口民生用品","輸出民生用品至馬尼拉","從日本輸入鹿皮"],1,"鄭氏政權從中國進口民生用品，也與日本及東南亞進行貿易。"],
["十七世紀曾經營海上貿易、招募漢人來臺開墾，卻未正式治理臺灣的是誰？",["鄭經","郭懷一","鄭芝龍","陳永華"],2,"鄭芝龍曾招募漢人來臺開墾，但沒有正式治理臺灣。"],
["西班牙人為維持經濟利益，會和漢人及原住民族換取哪種物品？",["絲綢","瓷器","軍用品","硫磺"],3,"北臺灣出產硫磺，是西班牙人重視的交易物品。"],
["鄭成功渡海來臺的主要原因是什麼？",["抓捕清帝國逃犯","受清帝國指派","取得反清基地","尋找養老地點"],2,"鄭成功需要穩定基地，繼續進行反清行動。"],
["哪一項是荷蘭人統治臺灣時的作為？",["在花蓮興建城堡","占領臺灣東部","引進牛隻協助耕作","建立漢人政權"],2,"荷蘭人引進牛隻，並鼓勵漢人使用牛隻協助耕作。"],
["郭懷一事件爆發的主要原因是什麼？",["政府課稅過重","宗教信仰衝突","爭奪貿易據點","爭奪水源"],0,"荷蘭統治者對漢人課稅與壓迫過重，引發郭懷一事件。"],
["鄭氏政權接手臺灣後，在農業方面採取哪種做法？",["搶奪他國農作物","發展休閒農業","禁止發展農業","在軍隊駐地開墾"],3,"鄭氏政權實施屯墾，讓軍隊在駐紮地開墾土地。"],
["歐洲各國在十七世紀陸續登陸臺灣，主要看重哪項優勢？",["位於東亞貿易航線","動物種類稀有","語言獨特","礦產資源豐富"],0,"臺灣位於東亞重要貿易航線，具有優越的交通與貿易位置。"],
["哪裡是鄭氏政權軍隊駐守及農墾的地點之一？",["臺東卑南","宜蘭頭城","桃園龍潭","臺南新營"],3,"新營的地名與鄭氏軍隊駐紮、屯墾的歷史有關。"],
["有關鄭氏政權在臺灣的發展，哪一項錯誤？",["興建全臺第一座孔廟","趕走北臺灣的西班牙人","曾派兵攻打大肚王國","在部分原住民部落設校"],1,"西班牙人先被荷蘭人趕出北臺灣，不是由鄭氏政權驅逐。"],
["荷蘭人在臺灣興建的第一座堡壘是哪一座？",["熱蘭遮堡","普羅民遮堡","淡水紅毛城","聖薩爾瓦多城"],0,"熱蘭遮堡是荷蘭人在臺灣興建的第一座堡壘。"]];
const short=[
["鄭氏政權制定中央與地方官制。",1,"鄭氏政權建立中央與地方行政制度。"],
["鄭氏政權向原住民族宣揚基督教。",0,"向原住民族宣揚基督教、使用羅馬字的是荷蘭統治時期的作為。"],
["鄭氏政權以羅馬字母拼寫原住民族語言。",0,"以羅馬字母記錄原住民族語言，是荷蘭傳教與教育的作為。"],
["鄭氏政權為取得土地，曾派兵攻打原住民族。",1,"鄭氏政權為擴張土地，曾與部分原住民族發生衝突。"],
["荷蘭人從臺灣出口鐵鍋。",0,"鐵鍋屬於輸入臺灣的商品，不是主要出口品。"],
["荷蘭人從臺灣出口軍用品。",0,"軍用品多由海外輸入臺灣。"],
["荷蘭人從臺灣出口蔗糖。",1,"蔗糖是荷蘭統治時期的重要出口商品。"],
["荷蘭人從臺灣出口鹿皮。",1,"臺灣鹿皮曾大量外銷到日本等地。"]];
const state={answered:0,score:0,wrong:[],student:''},quiz=document.querySelector('#quiz');
function section(title,meta,scenario=''){const s=document.createElement('section');s.innerHTML=`<div class="section-head"><h2>${title}</h2><span>${meta}</span></div>${scenario?`<div class="scenario"><p>${scenario}</p></div>`:''}`;quiz.appendChild(s);return s}
function addChoice(s,id,n,prompt,options,answer,explanation,points){const q=document.createElement('article');q.className='question';q.dataset.id=id;q.innerHTML=`<div class="qtop"><span class="num">${n}</span><div style="flex:1"><p class="prompt" id="${id}-prompt">${prompt}</p><div class="options" role="radiogroup" aria-labelledby="${id}-prompt">${options.map((o,i)=>`<div class="option"><input type="radio" id="${id}-${i}" name="${id}" value="${i}"><label for="${id}-${i}">${o}</label></div>`).join('')}</div><p class="feedback" aria-live="polite"></p></div></div>`;s.appendChild(q);q.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>grade(q,i,answer,explanation,points)))}
function grade(q,input,answer,explanation,points){if(q.dataset.done)return;q.dataset.done='1';q.querySelectorAll('input').forEach(x=>x.disabled=true);const ok=Number(input.value)===answer,f=q.querySelector('.feedback');f.className='feedback '+(ok?'correct':'wrong');f.textContent=(ok?'答對了！ ':'答錯了。 ')+explanation;if(ok)state.score+=points;else{state.wrong.push(q);q.classList.add('needs-review')}state.answered++;update()}
function build(){let s=section('一、是非題','每題 4 分，共 36 分');tf1.forEach((q,i)=>addChoice(s,'tf-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2],4));s=section('二、選擇題','每題 4 分，共 48 分');mc.forEach((q,i)=>addChoice(s,'mc-'+i,i+1,q[0],q[1],q[2],q[3],4));s=section('三、歷史作為與出口商品','每題 2 分，共 16 分');short.forEach((q,i)=>addChoice(s,'short-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2],2))}
function update(){document.querySelector('.count').textContent=`${state.answered}／29`;document.querySelector('.fill').style.width=`${state.answered/29*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',state.answered);if(state.answered===29)finish()}
function finish(){document.querySelector('#finishNote').hidden=true;document.querySelector('#studentResultName').textContent=state.student;document.querySelector('#finalScore').textContent=state.score;document.querySelector('#resultMessage').textContent=state.score>=90?'表現非常出色，你已掌握本單元！':state.score>=80?'達成學習目標！再複習錯題會更熟練。':state.score>=60?'已掌握部分內容，請依提示複習錯題。':'先別急，跟著提示一步一步補起觀念。';const unique=[...new Set(state.wrong)];document.querySelector('#reviewMessage').textContent=unique.length?`共有 ${unique.length} 題需要再複習，已用橘紅色標記。`:'全部答對，太厲害了！';document.querySelector('#reviewBtn').hidden=!unique.length;const r=document.querySelector('#result');r.classList.add('show');r.focus();r.scrollIntoView({behavior:'smooth',block:'center'})}
document.querySelector('#reviewBtn').addEventListener('click',()=>{const q=document.querySelector('.needs-review');if(q){q.tabIndex=-1;q.focus();q.scrollIntoView({behavior:'smooth',block:'center'})}});document.querySelector('#retryBtn').addEventListener('click',()=>location.reload());build();const studentSelect=document.querySelector('#studentName');quiz.classList.add('quiz-locked');quiz.querySelectorAll('input').forEach(x=>x.disabled=true);studentSelect.addEventListener('input',()=>{state.student=studentSelect.value;const locked=!state.student;quiz.classList.toggle('quiz-locked',locked);quiz.querySelectorAll('input').forEach(x=>{if(!x.closest('[data-done="1"]'))x.disabled=locked});document.querySelector('#studentHelp').textContent=locked?'輸入座號與姓名後，題目就會開放作答。':`${state.student}，可以開始作答了！`;if(!locked)quiz.querySelector('input').focus()});
</script></body></html>
