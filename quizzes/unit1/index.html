 ["臺灣總面積約 360 平方公里，而區域範圍中面積最大的是臺灣島。","錯","臺灣總面積約 36,000 平方公里，不是 360 平方公里。"],
 ["從卑南遺址發現的玉器飾品，可以推測當時人們已出現審美觀念。","對","玉器飾品除了實用，也反映當時人們的裝飾與審美觀念。"]
];
const mc=[
 ["臺灣島浮出海面，與哪一個板塊的活動較有關？",["太平洋板塊","非洲板塊","歐亞板塊","南極板塊"],2,"臺灣島的形成與歐亞板塊及菲律賓海板塊的碰撞有關。"],
 ["有關臺灣島的敘述，哪一項錯誤？",["南北長","東西窄","海岸線短","四面環海"],2,"臺灣島海岸線綿長，所以「海岸線短」是錯誤敘述。"],
 ["臺灣哪一個區域的海岸擁有較多斷崖景觀？",["北部","西部","南部","東部"],3,"臺灣東部山地靠近海岸，常見斷崖景觀。"],
 ["哪一座島嶼位於臺灣島的東南方？",["金門群島","馬祖列島","澎湖群島","綠島"],3,"綠島位於臺灣島東南方的太平洋上。"],
 ["高雄港是利用哪種海岸地形開發而成的重要商港？",["珊瑚礁","潟湖","岬灣","斷崖"],1,"高雄港利用潟湖地形開發，港內水域較平穩。"],
 ["有關黑嘴端鳳頭燕鷗的敘述，哪一項錯誤？",["數量稀少","被稱為神話之鳥","羽毛偏淺灰色","已經完全滅絕"],3,"黑嘴端鳳頭燕鷗數量稀少，但並未完全滅絕。"],
 ["阿富生活在十三行遺址，哪一項較可能是他的生活描述？",["搭乘飛機旅行","住在西式洋樓","跟遠方親友視訊","擁有煉製鐵器的技術"],3,"十三行文化的人們已經擁有煉製鐵器的技術。"],
 ["史前時期的劃分，是依據哪一項？",["人們的平均壽命","製作器物的方法","農作物的種類","候鳥的棲息路線"],1,"考古學家常依器物製作方法與材質，區分不同史前文化階段。"],
 ["臺灣東部地區適合發展賞鯨業的原因是什麼？",["離岸的海水深度達數百公尺","岩層較軟","海域較為平靜","以上都是"],0,"東部海岸離岸不遠處水深便可達數百公尺，鯨豚較容易靠近。"],
 ["臺灣位於亞洲進出哪個海域的航道，因而成為貿易往來的重要樞紐？",["太平洋","大西洋","印度洋","北極海"],0,"臺灣位在亞洲東側、太平洋西緣的重要航道上。"],
 ["人面造型陶罐是在哪個遺址中發現的？",["八仙洞","十三行","卑南","圓山"],1,"人面造型陶罐是十三行遺址的重要出土文物。"],
 ["考古挖掘發現由貝殼堆積而成的貝塚，較可能是哪一個遺址？",["卑南","十三行","圓山","漢本"],2,"圓山遺址發現貝塚，留下當時人們食用貝類的線索。"]
];
const tf2=[
 ["北方經由東海可以抵達日本。","對","臺灣北方隔著東海，往北可以抵達日本。"],
 ["西方隔臺灣海峽與韓國相望。","錯","臺灣西方隔臺灣海峽與中國大陸相望，不是韓國。"],
 ["臺灣位於亞洲與大西洋的交會處。","錯","臺灣位於亞洲東側與太平洋西緣的交會位置。"],
 ["南方隔著巴士海峽與菲律賓相鄰。","對","臺灣南方隔巴士海峽與菲律賓相鄰。"]
];
const read=[
 ["北回歸線是什麼直射地表最北端的假想線？",["太陽","月亮"],0,"北回歸線是太陽直射地表最北端的假想線。"],
 ["政府在北回歸線通過的哪一個縣市設立標誌物？",["苗栗","嘉義"],1,"北回歸線通過嘉義，當地設有北回歸線標誌。"]
];
const state={answered:0,score:0,wrong:[],student:''};
const quiz=document.querySelector('#quiz');
const sections=[];
function section(title,meta){const s=document.createElement('section');s.innerHTML=`<div class="section-head"><h2>${title}</h2><span>${meta}</span></div>`;quiz.appendChild(s);sections.push(s);return s}
function addChoice(s,id,n,prompt,options,answer,points,explanation){const q=document.createElement('article');q.className='question';q.dataset.id=id;q.innerHTML=`<div class="qtop"><span class="num">${n}</span><div style="flex:1"><p class="prompt" id="${id}-prompt">${prompt}</p><div class="options" role="radiogroup" aria-labelledby="${id}-prompt">${options.map((o,i)=>`<div class="option"><input type="radio" id="${id}-${i}" name="${id}" value="${i}"><label for="${id}-${i}">${o}</label></div>`).join('')}</div><p class="feedback" aria-live="polite"></p></div></div>`;s.appendChild(q);q.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>gradeChoice(q,i,answer,points,explanation)));}
function gradeChoice(q,input,answer,points,explanation){if(q.dataset.done)return;q.dataset.done='1';q.querySelectorAll('input').forEach(i=>i.disabled=true);const correct=Number(input.value)===answer;const f=q.querySelector('.feedback');f.className='feedback '+(correct?'correct':'wrong');f.textContent=(correct?'答對了！ ':'答錯了。 ')+explanation;if(correct)state.score+=points;else{state.wrong.push(q);q.classList.add('needs-review')}state.answered++;update();}
function build(){let s=section('一、是非題','每題 3 分，共 24 分');tf1.forEach((x,i)=>addChoice(s,'tf1-'+i,i+1,x[0],["對","錯"],x[1]==='對'?0:1,3,x[2]));s=section('二、選擇題','每題 3 分，共 36 分');mc.forEach((x,i)=>addChoice(s,'mc-'+i,i+1,x[0],x[1],x[2],3,x[3]));s=section('三、臺灣的地理位置','每題 3 分，共 12 分');tf2.forEach((x,i)=>addChoice(s,'tf2-'+i,i+1,x[0],["正確","錯誤"],x[1]==='對'?0:1,3,x[2]));buildMatch();s=section('五、閱讀理解','每題 2 分，共 4 分');read.forEach((x,i)=>addChoice(s,'read-'+i,i+1,x[0],x[1],x[2],2,x[3]));}
function buildMatch(){const s=section('四、海岸景觀配對','每格 3 分，共 24 分');const q=document.createElement('article');q.className='question';q.innerHTML=`<p class="prompt">請為臺灣島各區域選出正確的景點與海岸類型。</p><div class="match-grid"><span class="mh">區域</span><span class="mh">景點</span><span class="mh">海岸類型</span></div>`;s.appendChild(q);const rows=[['北部','龍洞','岬灣'],['南部','墾丁國家公園','珊瑚礁'],['西部','大安溪出海口','沙洲'],['東部','清水斷崖','斷崖']];const places=['請選擇','大安溪出海口','龍洞','清水斷崖','墾丁國家公園'];const types=['請選擇','珊瑚礁','岬灣','斷崖','沙洲'];const grid=q.querySelector('.match-grid');rows.forEach((r,ri)=>{const label=document.createElement('strong');label.textContent=r[0];grid.appendChild(label);[[places,r[1],'景點'],[types,r[2],'海岸類型']].forEach((cfg,ci)=>{const box=document.createElement('div');const id=`match-${ri}-${ci}`;box.innerHTML=`<label class="skip" for="${id}">${r[0]}的${cfg[2]}</label><select id="${id}"><option value="">${cfg[0][0]}</option>${cfg[0].slice(1).map(x=>`<option>${x}</option>`).join('')}</select><div class="cell-feedback" aria-live="polite"></div>`;grid.appendChild(box);const select=box.querySelector('select');select.addEventListener('change',()=>{if(!select.value||select.disabled)return;select.disabled=true;select.dataset.done='1';const ok=select.value===cfg[1];const f=box.querySelector('.cell-feedback');f.className='cell-feedback '+(ok?'correct':'wrong');f.textContent=ok?'答對了！':`答錯了，正解是${cfg[1]}。`;if(ok)state.score+=3;else{state.wrong.push(q);q.classList.add('needs-review')}state.answered++;update();});});});}
function update(){document.querySelector('.count').textContent=`${state.answered}／34`;document.querySelector('.fill').style.width=`${state.answered/34*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',state.answered);if(state.answered===34)finish();}
function finish(){document.querySelector('#finishNote').hidden=true;const result=document.querySelector('#result');document.querySelector('#studentResultName').textContent=state.student;document.querySelector('#finalScore').textContent=state.score;const msg=state.score>=90?'表現非常出色，你已掌握這個單元！':state.score>=80?'達成學習目標！再複習錯題，就會更熟練。':state.score>=60?'已掌握部分內容，請跟著提示複習錯題。':'先別急，從錯題提示開始，一步一步把觀念補起來。';document.querySelector('#resultMessage').textContent=msg;const unique=[...new Set(state.wrong)];document.querySelector('#reviewMessage').textContent=unique.length?`共有 ${unique.length} 個題組需要再複習。已用橘紅色標記。`:'全部答對，太厲害了！';document.querySelector('#reviewBtn').hidden=!unique.length;result.classList.add('show');result.focus();result.scrollIntoView({behavior:'smooth',block:'center'});}
document.querySelector('#reviewBtn').addEventListener('click',()=>{const first=document.querySelector('.needs-review');if(first){first.scrollIntoView({behavior:'smooth',block:'center'});first.setAttribute('tabindex','-1');first.focus();}});document.querySelector('#retryBtn').addEventListener('click',()=>location.reload());build();
const studentSelect=document.querySelector('#studentName');quiz.classList.add('quiz-locked');quiz.querySelectorAll('input,select').forEach(control=>control.disabled=true);studentSelect.addEventListener('input',()=>{state.student=studentSelect.value;const locked=!state.student;quiz.classList.toggle('quiz-locked',locked);quiz.querySelectorAll('input,select').forEach(control=>{if(!control.dataset.done&&!control.closest('[data-done="1"]'))control.disabled=locked});document.querySelector('#studentHelp').textContent=locked?'輸入座號與姓名後，題目就會開放作答。':`${state.student}，可以開始作答了！`;if(!locked)quiz.querySelector('input,select').focus();});
</script>
</body>
</html>
