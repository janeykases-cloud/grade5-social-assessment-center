<style>

</style></head><body><a class="hub-back" href="../../index.html" aria-label="返回五上社會學習評量中心">← 返回評量中心</a><a class="skip" href="#assessment">跳到評量內容</a><header><div class="bar"><svg class="emblem" viewBox="0 0 64 64" role="img" aria-label="島嶼文化圖示"><path d="M8 49c8-18 15-27 24-39 9 12 16 21 24 39-15-7-33-7-48 0z" fill="#d9b8ff"/><circle cx="32" cy="37" r="8" fill="#fff"/><path d="M32 29v16M24 37h16" stroke="#76519a" stroke-width="3"/></svg><div class="title-wrap"><p class="eyebrow">社會五上・第三單元</p><h1 class="title">臺灣的物產資源</h1></div><div class="score-chip">滿分 100</div></div></header><div class="progress-wrap"><div class="progress-inner"><span class="progress-label">作答進度</span><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"><div class="fill"></div></div><span class="count">0／25</span></div></div><main id="assessment"><div class="intro"><div><h2>認識物產，守護自然資源</h2><p>每題作答後立即查看對錯與說明。完成全部題目後，系統會公布總成績。</p></div><div class="legend"><span class="tag">即時回饋</span><span class="tag">每題 4 分</span><span class="tag">免登入</span></div><div class="student-picker"><label for="studentName">請輸入座號與姓名</label><input id="studentName" type="text" inputmode="text" autocomplete="off" maxlength="20" required aria-describedby="studentHelp" placeholder="例如：12 王小明"><span class="student-help" id="studentHelp">輸入座號與姓名後，題目就會開放作答。</span></div></div><form id="quiz" novalidate></form><p class="finish-note" id="finishNote">完成全部 25 題後，成績會在這裡公布。</p><section class="result" id="result" aria-live="polite" tabindex="-1"><h2>評量完成</h2><div class="score-summary" aria-label="學生姓名與評量成績"><div class="score-field"><span class="score-label">學生姓名</span><strong class="student-value" id="studentResultName">尚未選擇</strong></div><div class="score-field"><span class="score-label">評量成績</span><strong class="score-value"><span id="finalScore">0</span><small>／100 分</small></strong></div></div><p id="resultMessage"></p><div class="review" id="reviewMessage"></div><div class="actions"><button class="btn btn-primary" type="button" id="reviewBtn">查看需要複習的題目</button><button class="btn btn-secondary" type="button" id="retryBtn">重新作答</button></div></section><p class="privacy">姓名與答案只用於目前頁面的作答和計分，不會傳送到外部。</p></main>
<script>
const tf1=[
["現今臺灣農產品品質優良，除了供應國內需求，也受到國際市場肯定。",1,"臺灣農民改良技術與品種，許多優質農產品也外銷國外。"],
["臺灣鄰近的海底地形與常年經過的海流，使臺灣擁有豐富魚類資源。",1,"多樣海底地形與不同海流交會，提供魚類良好的生存環境。"],
["和國外相比，臺灣畜產生產成本較低，也不會產生汙染或傳染病問題。",0,"臺灣畜產規模較小、成本較高，仍需處理汙染與傳染病風險。"],
["現今市面上的原木家具，原料大多來自臺灣山林。",0,"臺灣已限制天然林砍伐，家具木材多依賴進口或人工林。"],
["過去為提高農作物產量而不當噴灑農藥，會汙染環境並影響人體健康。",1,"農藥若使用不當，可能殘留於環境與食物，危害生態和健康。"],
["臺灣每年從美國進口大量蘭花，因此有『蘭花王國』的稱號。",0,"臺灣因蘭花栽培與育種技術優良、外銷國際而被稱為蘭花王國。"],
["禽畜飼養已從早期小規模家庭副業，轉型為專業集中式經營的牧場。",1,"現代畜牧業多採專業化與集中式管理，以提高生產效率。"],
["臺車是日治時期重要的運輸工具，現在大多已被公路取代。",1,"早期臺車用於運送木材或物資，後來多被現代公路運輸取代。"],
["大理石礦主要用於建築與雕刻，目前臺灣只剩苗栗地區仍在開採。",0,"臺灣大理石主要產區在東部，不是只剩苗栗開採。"],
["臺灣東部海域的海底，是落差極大的斜坡地形。",1,"東部海岸外海很快變深，海底坡度較陡、落差大。"]];
const mc=[
["哪一項做法對生態保育較有幫助？",["砍伐陡坡樹木並改種農作物","持續開發大型林場販售林木","推廣有機農業和休閒農業","大量捕撈各種大小魚類"],2,"有機農業減少化學藥劑，休閒農業也能兼顧環境與地方發展。"],
["民國 80 年，政府全面禁止砍伐哪一種森林？",["天然林","紅樹林","人造林","以上都是"],0,"政府全面禁止砍伐天然林，並將部分林場轉型為森林遊樂區。"],
["臺灣多數煤礦停止開採，原因與哪一項較有關？",["礦產產量逐漸減少","經常發生礦災","工作環境影響健康","以上都是"],3,"產量減少、礦災風險與工作環境問題，都是煤礦停採的重要因素。"],
["有關臺灣製糖產業的敘述，哪一項錯誤？",["約四百年前開始發展製糖","蔗糖早期曾是日本進口糖主要來源","蔗糖曾帶動虎尾鎮發展","臺灣所有糖廠都已停止運作"],3,"部分糖廠仍以製糖、文化保存或觀光等形式運作。"],
["九份後來因開發哪一種礦產，採礦成為主要經濟活動？",["金礦","煤礦","大理石礦","銀礦"],0,"九份因金礦開採而繁榮，形成著名的礦業聚落。"],
["民國 50 多年時，南投車埕發展哪種產業，帶來大量經濟效益？",["畜牧業","林業","漁業","礦業"],1,"車埕曾是重要木材集散與加工地，林業帶動當地發展。"],
["有關山區發展的敘述，哪一項錯誤？",["朝向生態旅遊發展","重視當地文史資源","大多數山區已發展為城市","打造地方特色產品與服務"],2,"山區多朝生態、文化與地方特色發展，並非大多變成城市。"]];
const fish=[
["1 甲．小鮮應該是烏魚。",1,"烏魚會從中國沿海洄游到臺灣西南部海域產卵。"],
["1 乙．小鮮應該是櫻花鉤吻鮭。",0,"櫻花鉤吻鮭生活在臺灣高山溪流，不會從中國沿海洄游而來。"],
["2 甲．牠們大約在夏至前夕抵達產卵海域。",0,"烏魚大約在冬至前後到臺灣西南沿海產卵。"],
["2 乙．牠們大約在冬至前後抵達產卵海域。",1,"冬至前後是烏魚洄游到臺灣沿岸的主要季節。"],
["3 甲．牠們較可能選擇臺灣東北部海域產卵。",0,"烏魚主要洄游到臺灣西南部海域產卵。"],
["3 乙．牠們較可能選擇臺灣西南部海域產卵。",1,"臺灣西南沿海是烏魚重要產卵海域。"],
["4 甲．產卵海域的海底平坦寬廣。",1,"臺灣西部海底坡度較緩，海床平坦寬廣。"],
["4 乙．產卵海域是落差極大的斜坡。",0,"落差極大的斜坡是臺灣東部海底的特色。"]];
const state={answered:0,score:0,wrong:[],student:''},quiz=document.querySelector('#quiz');
function section(title,meta,scenario=''){const s=document.createElement('section');s.innerHTML=`<div class="section-head"><h2>${title}</h2><span>${meta}</span></div>${scenario?`<div class="scenario"><p>${scenario}</p></div>`:''}`;quiz.appendChild(s);return s}
function addChoice(s,id,n,prompt,options,answer,explanation){const q=document.createElement('article');q.className='question';q.dataset.id=id;q.innerHTML=`<div class="qtop"><span class="num">${n}</span><div style="flex:1"><p class="prompt" id="${id}-prompt">${prompt}</p><div class="options" role="radiogroup" aria-labelledby="${id}-prompt">${options.map((o,i)=>`<div class="option"><input type="radio" id="${id}-${i}" name="${id}" value="${i}"><label for="${id}-${i}">${o}</label></div>`).join('')}</div><p class="feedback" aria-live="polite"></p></div></div>`;s.appendChild(q);q.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>grade(q,i,answer,explanation)))}
function grade(q,input,answer,explanation){if(q.dataset.done)return;q.dataset.done='1';q.querySelectorAll('input').forEach(x=>x.disabled=true);const ok=Number(input.value)===answer,f=q.querySelector('.feedback');f.className='feedback '+(ok?'correct':'wrong');f.textContent=(ok?'答對了！ ':'答錯了。 ')+explanation;if(ok)state.score+=4;else{state.wrong.push(q);q.classList.add('needs-review')}state.answered++;update()}
function build(){let s=section('一、是非題','每題 4 分，共 40 分');tf1.forEach((q,i)=>addChoice(s,'tf-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2]));s=section('二、選擇題','每題 4 分，共 28 分');mc.forEach((q,i)=>addChoice(s,'mc-'+i,i+1,q[0],q[1],q[2],q[3]));s=section('三、烏魚洄游閱讀題','每個判斷 4 分，共 32 分','小鮮生活在中國沿海，準備和同伴穿越臺灣海峽，到臺灣沿岸產卵。牠們感覺海水逐漸變冷、顏色轉為暗藍，產卵後再南下到鵝鑾鼻附近，逆流北返回家。請分別判斷每個選項。');fish.forEach((q,i)=>addChoice(s,'fish-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2]))}
function update(){document.querySelector('.count').textContent=`${state.answered}／25`;document.querySelector('.fill').style.width=`${state.answered/25*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',state.answered);if(state.answered===25)finish()}
function finish(){document.querySelector('#finishNote').hidden=true;document.querySelector('#studentResultName').textContent=state.student;document.querySelector('#finalScore').textContent=state.score;document.querySelector('#resultMessage').textContent=state.score>=90?'表現非常出色，你已掌握本單元！':state.score>=80?'達成學習目標！再複習錯題會更熟練。':state.score>=60?'已掌握部分內容，請依提示複習錯題。':'先別急，跟著提示一步一步補起觀念。';const unique=[...new Set(state.wrong)];document.querySelector('#reviewMessage').textContent=unique.length?`共有 ${unique.length} 題需要再複習，已用橘紅色標記。`:'全部答對，太厲害了！';document.querySelector('#reviewBtn').hidden=!unique.length;const r=document.querySelector('#result');r.classList.add('show');r.focus();r.scrollIntoView({behavior:'smooth',block:'center'})}
document.querySelector('#reviewBtn').addEventListener('click',()=>{const q=document.querySelector('.needs-review');if(q){q.tabIndex=-1;q.focus();q.scrollIntoView({behavior:'smooth',block:'center'})}});document.querySelector('#retryBtn').addEventListener('click',()=>location.reload());build();const studentSelect=document.querySelector('#studentName');quiz.classList.add('quiz-locked');quiz.querySelectorAll('input').forEach(x=>x.disabled=true);studentSelect.addEventListener('input',()=>{state.student=studentSelect.value;const locked=!state.student;quiz.classList.toggle('quiz-locked',locked);quiz.querySelectorAll('input').forEach(x=>{if(!x.closest('[data-done="1"]'))x.disabled=locked});document.querySelector('#studentHelp').textContent=locked?'輸入座號與姓名後，題目就會開放作答。':`${state.student}，可以開始作答了！`;if(!locked)quiz.querySelector('input').focus()});
</script></body></html>
