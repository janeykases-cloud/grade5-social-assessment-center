</style></head><body><a class="hub-back" href="../../index.html" aria-label="返回五上社會學習評量中心">← 返回評量中心</a><a class="skip" href="#assessment">跳到評量內容</a><header><div class="bar"><svg class="emblem" viewBox="0 0 64 64" role="img" aria-label="島嶼文化圖示"><path d="M8 49c8-18 15-27 24-39 9 12 16 21 24 39-15-7-33-7-48 0z" fill="#d6b95a"/><circle cx="32" cy="37" r="8" fill="#fff"/><path d="M32 29v16M24 37h16" stroke="#2f7d5a" stroke-width="3"/></svg><div class="title-wrap"><p class="eyebrow">社會五上・第二單元</p><h1 class="title">島嶼上的生活樣貌</h1></div><div class="score-chip">滿分 100</div></div></header><div class="progress-wrap"><div class="progress-inner"><span class="progress-label">作答進度</span><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"><div class="fill"></div></div><span class="count">0／25</span></div></div><main id="assessment"><div class="intro"><div><h2>觀察文化，理解生活規範</h2><p>每題作答後立即查看對錯與說明。完成全部題目後，系統會公布總成績。</p></div><div class="legend"><span class="tag">即時回饋</span><span class="tag">每題 4 分</span><span class="tag">免登入</span></div><div class="student-picker"><label for="studentName">請輸入座號與姓名</label><input id="studentName" type="text" inputmode="text" autocomplete="off" maxlength="20" required aria-describedby="studentHelp" placeholder="例如：12 王小明"><span class="student-help" id="studentHelp">輸入座號與姓名後，題目就會開放作答。</span></div></div><form id="quiz" novalidate></form><p class="finish-note" id="finishNote">完成全部 25 題後，成績會在這裡公布。</p><section class="result" id="result" aria-live="polite" tabindex="-1"><h2>評量完成</h2><div class="score-summary" aria-label="學生姓名與評量成績"><div class="score-field"><span class="score-label">學生姓名</span><strong class="student-value" id="studentResultName">尚未選擇</strong></div><div class="score-field"><span class="score-label">評量成績</span><strong class="score-value"><span id="finalScore">0</span><small>／100 分</small></strong></div></div><p id="resultMessage"></p><div class="review" id="reviewMessage"></div><div class="actions"><button class="btn btn-primary" type="button" id="reviewBtn">查看需要複習的題目</button><button class="btn btn-secondary" type="button" id="retryBtn">重新作答</button></div></section><p class="privacy">姓名與答案只用於目前頁面的作答和計分，不會傳送到外部。</p></main>
<script>
const tf1=[
["排灣族為階級社會，分成頭目、貴族、勇士、平民四個階級。",1,"排灣族的傳統社會具有階級制度。"],
["早期來臺的漢人移民多與同姓的族群聚居在一起，並形成宗族組織。",1,"同姓族人聚居並成立宗族，可互相照顧、維護家族利益。"],
["住在山地及東部地區的原住民族，因較早與漢人接觸，文化多已和漢人融合。",0,"山地與東部族群較晚大量接觸漢人，因此保留較多傳統文化。"],
["原鄉神明信仰，是渡海來臺的漢人移民凝聚情感和團結力量的重要媒介。",1,"共同祭祀家鄉神明，能凝聚移民的情感與互助力量。"],
["宗教信仰源自人們對自然與先人等的敬畏，並逐漸發展出指引信徒的教義。",1,"宗教常從敬畏自然、祖先或神靈發展，形成儀式與教義。"],
["網路世界是虛擬的，不受法律拘束，所以可以任意辱罵別人。",0,"網路言行同樣受法律規範，辱罵、霸凌或散布不實訊息可能違法。"],
["在沒有文字記載的時代，原住民族的祖先會透過口述，世代傳承祖靈的訓示。",1,"口述傳統能把歷史、規範與祖靈訓示傳給下一代。"],
["現今法律規定兒子從父姓、女兒從母姓。",0,"子女姓氏可以由父母約定，並非依性別固定。"],
["政府以法律規定哪些行為違法，例如機車行駛人行道會受罰。",1,"法律明確規範行為，也由國家公權力執行。"],
["面對不合時宜的社會規範，應尋求適當的方式調整。",1,"社會規範會隨社會需求改變，可透過討論或修法調整。"]];
const mc=[
["娟娟因心情不好而對關心她的媽媽大發脾氣，事後感到愧疚。她違反哪種社會規範？",["倫理道德","法律","宗教信仰","風俗習慣"],0,"尊重、體諒家人屬於倫理道德。"],
["爺爺提醒正豪，到廟裡拜拜要虔誠，才能獲得神明庇佑。這是哪種社會規範？",["法律","風俗習慣","宗教信仰","倫理道德"],2,"對神明的信念與祭拜行為屬於宗教信仰。"],
["哪一項不屬於早期漢人宗族組織的功能？",["規畫年節祭祖活動","教授原住民族打獵技巧","維護家族成員利益","維持地方秩序"],1,"宗族服務家族成員，並不負責教授原住民族打獵。"],
["有關早期來臺漢人的宗教信仰，哪一項正確？",["認為赤榕是天神降臨的天梯","將家鄉廟宇的神像奉請來臺","狩獵前舉行祭典感謝大地","請祭師祈福與驅靈"],1,"漢人移民常奉請原鄉神像來臺，延續信仰並凝聚移民。"],
["哪一個不是臺灣平埔族群主要分布的區域？",["東部地區與周圍島嶼","西部海岸","西部平原","西部丘陵"],0,"平埔族群主要分布在臺灣西部的海岸、平原與丘陵。"],
["除夕全家團圓、吃年夜飯及發紅包，主要屬於哪種社會規範？",["法律","宗教信仰","倫理道德","風俗習慣"],3,"除夕團圓與發紅包是長久流傳的風俗習慣。"],
["有關原住民族祭師文化，哪一項錯誤？",["祭師傳承宗教儀式","許多祭師文化面臨傳承困境","祭師文化不必重視或傳承","祭師能與祖靈溝通"],2,"祭師文化是重要文化資產，應受到重視與尊重。"],
["哪一項是國家執行公權力的後盾？",["法律","倫理道德","宗教信仰","風俗習慣"],0,"國家依法律執行公權力，並保障人民權利。"]];
const bullying=[
["班上同學嘲笑、搶走文具並把阿賢的書包丟進垃圾桶，這些欺負行為已經構成違法。",1,"持續欺負、侮辱或破壞他人物品可能涉及違法，學校也應介入處理。"],
["阿賢無法透過任何方式求助，只能改變自己的個性。",0,"遭受欺負不是阿賢的錯。他可以向教師、家長或其他可信任的大人求助。"],
["國家制定相關法律，讓行為偏差的未成年人有改過向上的機會。",1,"少年事件處理制度兼顧保護、輔導與改過機會。"]];
const indigenous=[
["傳統領域是原住民族原本的生活範圍。",1,"傳統領域包含族人長期生活、狩獵、祭儀與文化活動的空間。"],
["卑南族及阿美族為階級社會。",0,"卑南族與阿美族傳統上以年齡階級和母系社會等特色著稱，不是題目所稱的階級社會。"],
["庫巴是鄒族成年男子討論事務的地方。",1,"庫巴是鄒族重要的男子集會所，也是討論部落事務的場所。"],
["在原住民族的母系社會中，財產多由女兒繼承，男方隨妻居住。",1,"母系社會多由女性承繼家產，婚後常採從妻居。"]];
const state={answered:0,score:0,wrong:[],student:''},quiz=document.querySelector('#quiz');
function section(title,meta,scenario=''){const s=document.createElement('section');s.innerHTML=`<div class="section-head"><h2>${title}</h2><span>${meta}</span></div>${scenario?`<div class="scenario"><p>${scenario}</p></div>`:''}`;quiz.appendChild(s);return s}
function addChoice(s,id,n,prompt,options,answer,explanation){const q=document.createElement('article');q.className='question';q.dataset.id=id;q.innerHTML=`<div class="qtop"><span class="num">${n}</span><div style="flex:1"><p class="prompt" id="${id}-prompt">${prompt}</p><div class="options" role="radiogroup" aria-labelledby="${id}-prompt">${options.map((o,i)=>`<div class="option"><input type="radio" id="${id}-${i}" name="${id}" value="${i}"><label for="${id}-${i}">${o}</label></div>`).join('')}</div><p class="feedback" aria-live="polite"></p></div></div>`;s.appendChild(q);q.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>grade(q,i,answer,explanation)))}
function grade(q,input,answer,explanation){if(q.dataset.done)return;q.dataset.done='1';q.querySelectorAll('input').forEach(x=>x.disabled=true);const ok=Number(input.value)===answer,f=q.querySelector('.feedback');f.className='feedback '+(ok?'correct':'wrong');f.textContent=(ok?'答對了！ ':'答錯了。 ')+explanation;if(ok)state.score+=4;else{state.wrong.push(q);q.classList.add('needs-review')}state.answered++;update()}
function build(){let s=section('一、是非題','每題 4 分，共 40 分');tf1.forEach((q,i)=>addChoice(s,'tf-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2]));s=section('二、選擇題','每題 4 分，共 32 分');mc.forEach((q,i)=>addChoice(s,'mc-'+i,i+1,q[0],q[1],q[2],q[3]));s=section('三、校園情境判斷','每題 4 分，共 12 分','阿賢個性內向，常被同學嘲笑外貌、搶走文具，甚至把書包丟進垃圾桶，讓他害怕上學。請判斷下列敘述。');bullying.forEach((q,i)=>addChoice(s,'bully-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2]));s=section('四、原住民族資料判斷','每題 4 分，共 16 分');indigenous.forEach((q,i)=>addChoice(s,'ind-'+i,i+1,q[0],["正確","錯誤"],q[1]?0:1,q[2]))}
function update(){document.querySelector('.count').textContent=`${state.answered}／25`;document.querySelector('.fill').style.width=`${state.answered/25*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',state.answered);if(state.answered===25)finish()}
function finish(){document.querySelector('#finishNote').hidden=true;document.querySelector('#studentResultName').textContent=state.student;document.querySelector('#finalScore').textContent=state.score;document.querySelector('#resultMessage').textContent=state.score>=90?'表現非常出色，你已掌握本單元！':state.score>=80?'達成學習目標！再複習錯題會更熟練。':state.score>=60?'已掌握部分內容，請依提示複習錯題。':'先別急，跟著提示一步一步補起觀念。';const unique=[...new Set(state.wrong)];document.querySelector('#reviewMessage').textContent=unique.length?`共有 ${unique.length} 題需要再複習，已用橘紅色標記。`:'全部答對，太厲害了！';document.querySelector('#reviewBtn').hidden=!unique.length;const r=document.querySelector('#result');r.classList.add('show');r.focus();r.scrollIntoView({behavior:'smooth',block:'center'})}
document.querySelector('#reviewBtn').addEventListener('click',()=>{const q=document.querySelector('.needs-review');if(q){q.tabIndex=-1;q.focus();q.scrollIntoView({behavior:'smooth',block:'center'})}});document.querySelector('#retryBtn').addEventListener('click',()=>location.reload());build();const studentSelect=document.querySelector('#studentName');quiz.classList.add('quiz-locked');quiz.querySelectorAll('input').forEach(x=>x.disabled=true);studentSelect.addEventListener('input',()=>{state.student=studentSelect.value;const locked=!state.student;quiz.classList.toggle('quiz-locked',locked);quiz.querySelectorAll('input').forEach(x=>{if(!x.closest('[data-done="1"]'))x.disabled=locked});document.querySelector('#studentHelp').textContent=locked?'輸入座號與姓名後，題目就會開放作答。':`${state.student}，可以開始作答了！`;if(!locked)quiz.querySelector('input').focus()});
</script></body></html>
